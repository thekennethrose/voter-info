repos:
  - repo: local
    hooks:
      - id: no-api-keys
        name: block Tavily/DeepSeek-style API keys
        language: pygrep
        entry: '(tvly-[A-Za-z0-9_-]{16,}|sk-[A-Za-z0-9]{24,})'
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        # Must list the full set: custom types without feat/fix replace the defaults
        args: [feat, fix, chore, docs, test, refactor, ci, build, perf, revert, style, data, prompt]
